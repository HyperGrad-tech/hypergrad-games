<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Simon Says - Play Free Online | HyperGrad Games</title>
<meta name="description" content="Play Simon Says memory game online for free. Watch the color sequence and repeat it back. How long can you go? No download needed.">
<link rel="canonical" href="https://games.hypergrad.cn/games/simon.html">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/i18n.js"></script>
<style>
  .simon-board { width: 320px; height: 320px; position: relative; border-radius: 50%; overflow: hidden; }
  .simon-pad { position: absolute; width: 50%; height: 50%; opacity: 0.6; cursor: pointer; transition: opacity 0.1s; display: flex; align-items: center; justify-content: center; }
  .simon-pad.active { opacity: 1; }
  .simon-pad.green { top: 0; left: 0; background: #22C55E; border-top-left-radius: 100%; }
  .simon-pad.red { top: 0; right: 0; background: #EF4444; border-top-right-radius: 100%; }
  .simon-pad.yellow { bottom: 0; left: 0; background: #F59E0B; border-bottom-left-radius: 100%; }
  .simon-pad.blue { bottom: 0; right: 0; background: #3B82F6; border-bottom-right-radius: 100%; }
  .simon-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 120px; height: 120px; background: var(--bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; color: var(--text); z-index: 10; border: 4px solid var(--border); }
</style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Simon Says",
    "description": "Watch the color sequence and repeat it back in Simon Says memory game.",
    "url": "https://games.hypergrad.cn/games/simon.html",
    "genre": "Memory",
    "gamePlatform": "Web Browser",
    "applicationCategory": "Game",
    "operatingSystem": "Any (Web Browser)",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "publisher": {
      "@type": "Organization",
      "name": "HyperGrad"
    }
  }
  </script>
</head>
<body>
<header class="site-header"><div class="site-header-inner"><a href="/" class="site-logo">HyperGrad <span>Games</span></a><nav class="site-nav"><a href="../index.html#puzzle">Puzzle</a><a href="../index.html#arcade">Arcade</a><a href="../index.html#strategy">Strategy</a></nav><button id="lang-switch" class="lang-btn" onclick="I18N.toggle()">中文</button></div></header>
<div class="game-page">
  <div class="game-header">
    <h1 class="game-title">Simon Says</h1>
    <a href="../index.html" class="game-back"><span data-i18n="game.back">← All Games</span></a>
  </div>
  <div class="game-stats">
    <div class="stat-box"><div class="stat-label" data-i18n-en="Round" data-i18n-zh="轮次">Round</div><div class="stat-value" id="round">0</div></div>
    <div class="stat-box"><div class="stat-label" data-i18n="game.best">Best</div><div class="stat-value" id="best">0</div></div>
  </div>
  <div class="game-board">
    <div class="simon-board" id="board">
      <div class="simon-pad green" data-color="0"></div>
      <div class="simon-pad red" data-color="1"></div>
      <div class="simon-pad yellow" data-color="2"></div>
      <div class="simon-pad blue" data-color="3"></div>
      <div class="simon-center" id="center">--</div>
    </div>
    <div class="game-overlay hidden" id="overlay">
      <h2>Game Over!</h2>
      <p id="overlay-text"></p>
      <button class="btn" onclick="startGame()" data-i18n-en="Play Again" data-i18n-zh="再玩一次">Play Again</button>
    </div>
  </div>
  <div class="game-controls">
    <button class="btn" onclick="startGame()" data-i18n-en="Start" data-i18n-zh="开始">Start</button>
  </div>
  <div class="game-instructions">
    <h3 data-i18n="game.howto">How to Play</h3>
    <ul>
      <li data-i18n-en="Press Start to begin" data-i18n-zh="按开始键启动">Press Start to begin</li>
      <li data-i18n-en="Watch the sequence of flashing colors" data-i18n-zh="观察闪烁的颜色顺序">Watch the sequence of flashing colors</li>
      <li data-i18n-en="Repeat the sequence by clicking the pads in the same order" data-i18n-zh="按相同顺序点击色块来重复序列">Repeat the sequence by clicking the pads in the same order</li>
      <li data-i18n-en="Each round adds one more step. How far can you go?" data-i18n-zh="每轮增加一步。你能走多远？">Each round adds one more step. How far can you go?</li>
    </ul>
  </div>
</div>
<script>
let sequence,userInput,round,best=+localStorage.getItem('bestSimon')||0,playing,showing;
document.getElementById('best').textContent=best;
const COLORS=['green','red','yellow','blue'];
function startGame(){sequence=[];round=0;playing=false;document.getElementById('overlay').classList.add('hidden');nextRound();}
function nextRound(){round++;sequence.push(Math.floor(Math.random()*4));userInput=[];playing=false;showing=true;document.getElementById('round').textContent=round;document.getElementById('center').textContent=round;playSequence();}
async function playSequence(){for(let i=0;i<sequence.length;i++){await sleep(400);flash(sequence[i]);await sleep(200);}showing=false;playing=true;}
function flash(color){const pad=document.querySelector(`.simon-pad[data-color="${color}"]`);pad.classList.add('active');setTimeout(()=>pad.classList.remove('active'),300);}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function handleClick(color){if(!playing)return;flash(color);userInput.push(color);const idx=userInput.length-1;if(userInput[idx]!==sequence[idx]){gameOver();return;}if(userInput.length===sequence.length){playing=false;setTimeout(nextRound,600);}}
document.querySelectorAll('.simon-pad').forEach(pad=>{pad.addEventListener('click',()=>handleClick(+pad.dataset.color));pad.addEventListener('touchstart',e=>{e.preventDefault();handleClick(+pad.dataset.color);},{passive:false});});
function gameOver(){playing=false;showing=false;if(round-1>best){best=round-1;localStorage.setItem('bestSimon',best);document.getElementById('best').textContent=best;}document.getElementById('overlay-text').textContent=`You reached round ${round-1}`;document.getElementById('overlay').classList.remove('hidden');}
</script>
</body>
</html>
