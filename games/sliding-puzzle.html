<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sliding Puzzle - Play Free Online | HyperGrad Games</title>
<meta name="description" content="Play the classic 15-sliding puzzle online for free. Arrange tiles in order from 1 to 15. No download needed.">
<link rel="canonical" href="https://games.hypergrad.cn/games/sliding-puzzle.html">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/i18n.js"></script>
<style>
  .sp-grid { display: grid; grid-template-columns: repeat(4, 80px); grid-template-rows: repeat(4, 80px); gap: 4px; background: var(--border); padding: 4px; border-radius: 8px; }
  .sp-tile { background: var(--primary); color: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; cursor: pointer; transition: all 0.15s; }
  .sp-tile:hover { background: var(--primary-light); }
  .sp-tile.empty { background: transparent; cursor: default; }
  @media (max-width: 768px) { .sp-grid { grid-template-columns: repeat(4, 70px); grid-template-rows: repeat(4, 70px); } .sp-tile { font-size: 28px; } }
</style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Sliding Puzzle",
    "description": "Arrange tiles in order from 1 to 15 in this classic sliding puzzle.",
    "url": "https://games.hypergrad.cn/games/sliding-puzzle.html",
    "genre": "Puzzle",
    "gamePlatform": "Web Browser",
    "applicationCategory": "Game",
    "operatingSystem": "Any (Web Browser)",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "publisher": {
      "@type": "Organization",
      "name": "HyperGrad"
    }
  }
  </script>
</head>
<body>
<header class="site-header"><div class="site-header-inner"><a href="/" class="site-logo">HyperGrad <span>Games</span></a><nav class="site-nav"><a href="../index.html#puzzle">Puzzle</a><a href="../index.html#arcade">Arcade</a><a href="../index.html#strategy">Strategy</a></nav><button id="lang-switch" class="lang-btn" onclick="I18N.toggle()">中文</button></div></header>
<div class="game-page">
  <div class="game-header">
    <h1 class="game-title">Sliding Puzzle</h1>
    <a href="../index.html" class="game-back"><span data-i18n="game.back">← All Games</span></a>
  </div>
  <div class="game-stats">
    <div class="stat-box"><div class="stat-label" data-i18n="game.moves">Moves</div><div class="stat-value" id="moves">0</div></div>
    <div class="stat-box"><div class="stat-label" data-i18n="game.time">Time</div><div class="stat-value" id="time">0</div></div>
  </div>
  <div class="game-board">
    <div class="sp-grid" id="grid"></div>
    <div class="game-overlay hidden" id="overlay">
      <h2>Solved!</h2>
      <p id="overlay-text"></p>
      <button class="btn" onclick="newGame()" data-i18n-en="Play Again" data-i18n-zh="再玩一次">Play Again</button>
    </div>
  </div>
  <div class="game-controls">
    <button class="btn" onclick="newGame()" data-i18n-en="New Game" data-i18n-zh="新游戏">New Game</button>
  </div>
  <div class="game-instructions">
    <h3 data-i18n="game.howto">How to Play</h3>
    <ul>
      <li data-i18n-en="Click a tile adjacent to the empty space to slide it" data-i18n-zh="点击与空格相邻的方块来滑动">Click a tile adjacent to the empty space to slide it</li>
      <li data-i18n-en="Arrange tiles in order from 1 to 15" data-i18n-zh="将方块按 1 到 15 顺序排列">Arrange tiles in order from 1 to 15</li>
      <li data-i18n-en="The empty space should end up in the bottom-right corner" data-i18n-zh="空格最终应在右下角">The empty space should end up in the bottom-right corner</li>
      <li data-i18n-en="Solve in as few moves as possible" data-i18n-zh="用尽可能少的步数完成">Solve in as few moves as possible</li>
    </ul>
  </div>
</div>
<script>
const N=4;let tiles,emptyIdx,moves,timer,timerStart,gameOver,lastMove=-1;
function newGame(){tiles=[...Array(N*N-1).keys()].map(i=>i+1);tiles.push(0);emptyIdx=N*N-1;// Shuffle by making random valid moves (guarantees solvability)
for(let i=0;i<500;i++){const valid=neighbors(emptyIdx).filter(n=>n!==lastMove);const pick=valid[Math.floor(Math.random()*valid.length)];swap(pick);lastMove=emptyIdx;}moves=0;gameOver=false;document.getElementById('moves').textContent=0;document.getElementById('time').textContent=0;document.getElementById('overlay').classList.add('hidden');timerStart=Date.now();if(timer)clearInterval(timer);timer=setInterval(()=>{if(!gameOver)document.getElementById('time').textContent=Math.floor((Date.now()-timerStart)/1000);},1000);render();}
function neighbors(idx){const r=Math.floor(idx/N),c=idx%N;const res=[];if(r>0)res.push(idx-N);if(r<N-1)res.push(idx+N);if(c>0)res.push(idx-1);if(c<N-1)res.push(idx+1);return res;}
function swap(i){tiles[emptyIdx]=tiles[i];tiles[i]=0;emptyIdx=i;}
function clickTile(i){if(gameOver)return;if(!neighbors(emptyIdx).includes(i))return;swap(i);moves++;document.getElementById('moves').textContent=moves;render();checkWin();}
function checkWin(){for(let i=0;i<N*N-1;i++)if(tiles[i]!==i+1)return;if(tiles[N*N-1]===0){gameOver=true;clearInterval(timer);const t=Math.floor((Date.now()-timerStart)/1000);document.getElementById('overlay-text').textContent=`Time: ${t}s · Moves: ${moves}`;document.getElementById('overlay').classList.remove('hidden');}}
function render(){const g=document.getElementById('grid');g.innerHTML='';tiles.forEach((v,i)=>{const tile=document.createElement('div');tile.className='sp-tile';if(v===0)tile.classList.add('empty');else tile.textContent=v;tile.addEventListener('click',()=>clickTile(i));g.appendChild(tile);});}
newGame();
</script>
</body>
</html>
