<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hangman - Play Free Online | HyperGrad Games</title>
<meta name="description" content="Play Hangman online for free. Guess the hidden word letter by letter before the stickman is complete. No download needed.">
<link rel="canonical" href="https://games.hypergrad.cn/games/hangman.html">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/i18n.js"></script>
<style>
  .hangman-svg { width: 200px; height: 250px; }
  .hangman-svg line, .hangman-svg circle { stroke: var(--text); stroke-width: 3; fill: none; }
  .hangman-svg .hidden { display: none; }
  .word-display { font-size: 36px; letter-spacing: 8px; font-family: monospace; font-weight: 700; color: var(--primary-light); margin: 20px 0; }
  .alpha-pad { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 400px; margin: 0 auto; }
  .alpha-btn { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 6px; width: 40px; height: 40px; font-size: 16px; font-weight: 600; color: var(--text); cursor: pointer; text-transform: uppercase; }
  .alpha-btn:hover:not(:disabled) { background: var(--primary); color: #fff; }
  .alpha-btn:disabled { opacity: 0.3; cursor: default; }
  .alpha-btn.correct { background: var(--success); color: #fff; }
  .alpha-btn.wrong { background: var(--danger); color: #fff; }
</style>
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"VideoGame","name":"Hangman","description":"Guess the hidden word letter by letter before the stickman is complete.","url":"https://games.hypergrad.cn/games/hangman.html","genre":"Puzzle","gamePlatform":"Web Browser","applicationCategory":"Game","operatingSystem":"Any (Web Browser)","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"publisher":{"@type":"Organization","name":"HyperGrad"}}
</script>
</head>
<body>
<header class="site-header"><div class="site-header-inner"><a href="/" class="site-logo">HyperGrad <span>Games</span></a><nav class="site-nav"><a href="../index.html#puzzle">Puzzle</a><a href="../index.html#arcade">Arcade</a><a href="../index.html#strategy">Strategy</a></nav><button id="lang-switch" class="lang-btn" onclick="I18N.toggle()">中文</button></div></header>
<div class="game-page">
  <div class="game-header">
    <h1 class="game-title">Hangman</h1>
    <a href="../index.html" class="game-back"><span data-i18n="game.back">← All Games</span></a>
  </div>
  <div class="game-stats">
    <div class="stat-box"><div class="stat-label" data-i18n-en="Wrong" data-i18n-zh="错误">Wrong</div><div class="stat-value" id="wrong">0/6</div></div>
    <div class="stat-box"><div class="stat-label" data-i18n-en="Wins" data-i18n-zh="胜">Wins</div><div class="stat-value" id="wins">0</div></div>
    <div class="stat-box"><div class="stat-label" data-i18n-en="Losses" data-i18n-zh="负">Losses</div><div class="stat-value" id="losses">0</div></div>
  </div>
  <div class="game-board" style="flex-direction:column;gap:16px;">
    <svg class="hangman-svg" viewBox="0 0 200 250">
      <line x1="20" y1="230" x2="120" y2="230"/>
      <line x1="50" y1="230" x2="50" y2="20"/>
      <line x1="50" y1="20" x2="130" y2="20"/>
      <line x1="130" y1="20" x2="130" y2="50"/>
      <circle id="head" cx="130" cy="65" r="15" class="hidden"/>
      <line id="body" x1="130" y1="80" x2="130" y2="140" class="hidden"/>
      <line id="arm-l" x1="130" y1="100" x2="110" y2="120" class="hidden"/>
      <line id="arm-r" x1="130" y1="100" x2="150" y2="120" class="hidden"/>
      <line id="leg-l" x1="130" y1="140" x2="110" y2="170" class="hidden"/>
      <line id="leg-r" x1="130" y1="140" x2="150" y2="170" class="hidden"/>
    </svg>
    <div class="word-display" id="word"></div>
    <div class="alpha-pad" id="alpha-pad"></div>
    <div class="game-overlay hidden" id="overlay">
      <h2 id="overlay-title" data-i18n-en="You Win!" data-i18n-zh="你赢了！">You Win!</h2>
      <p id="overlay-text"></p>
      <button class="btn" onclick="newGame()" data-i18n-en="Play Again" data-i18n-zh="再玩一次">Play Again</button>
    </div>
  </div>
  <div class="game-instructions">
    <h3 data-i18n="game.howto">How to Play</h3>
    <ul>
      <li data-i18n-en="Click letters to guess the hidden word" data-i18n-zh="点击字母来猜测隐藏的单词">Click letters to guess the hidden word</li>
      <li data-i18n-en="Correct letters appear in the word" data-i18n-zh="猜对的字母会显示在单词中">Correct letters appear in the word</li>
      <li data-i18n-en="Wrong guesses add body parts to the stickman" data-i18n-zh="猜错会为火柴人添加身体部位">Wrong guesses add body parts to the stickman</li>
      <li data-i18n-en="Six wrong guesses and you lose!" data-i18n-zh="猜错 6 次即失败！">Six wrong guesses and you lose!</li>
    </ul>
  </div>
</div>
<script>
const WORDS=["javascript","programming","computer","keyboard","internet","software","algorithm","database","network","application","developer","function","variable","browser","document","element","response","request","server","client","mobile","desktop","cloud","python","react","angular","vue","node","docker","kubernetes"];
const PARTS=['head','body','arm-l','arm-r','leg-l','leg-r'];
let word,guessed,wrongCount,gameOver,stats={wins:+localStorage.getItem('hangWins')||0,losses:+localStorage.getItem('hangLosses')||0};
document.getElementById('wins').textContent=stats.wins;document.getElementById('losses').textContent=stats.losses;
function newGame(){word=WORDS[Math.floor(Math.random()*WORDS.length)];guessed=new Set();wrongCount=0;gameOver=false;PARTS.forEach(p=>document.getElementById(p).classList.add('hidden'));document.getElementById('overlay').classList.add('hidden');document.getElementById('wrong').textContent='0/6';renderWord();renderAlpha();}
function renderWord(){const display=word.split('').map(c=>guessed.has(c)?c.toUpperCase():'_').join(' ');document.getElementById('word').textContent=display;}
function renderAlpha(){const pad=document.getElementById('alpha-pad');pad.innerHTML='';for(let i=97;i<=122;i++){const c=String.fromCharCode(i);const btn=document.createElement('button');btn.className='alpha-btn';btn.textContent=c;btn.onclick=()=>guess(c);if(guessed.has(c)){btn.disabled=true;if(word.includes(c))btn.classList.add('correct');else btn.classList.add('wrong');}pad.appendChild(btn);}}
function guess(letter){if(gameOver||guessed.has(letter))return;guessed.add(letter);if(!word.includes(letter)){wrongCount++;document.getElementById('wrong').textContent=wrongCount+'/6';document.getElementById(PARTS[wrongCount-1]).classList.remove('hidden');if(wrongCount>=6){endGame(false);return;}}renderWord();renderAlpha();if(word.split('').every(c=>guessed.has(c)))endGame(true);}
function endGame(won){gameOver=true;if(won){stats.wins++;localStorage.setItem('hangWins',stats.wins);}else{stats.losses++;localStorage.setItem('hangLosses',stats.losses);}document.getElementById('wins').textContent=stats.wins;document.getElementById('losses').textContent=stats.losses;document.getElementById('overlay-title').textContent=won?'You Win!':'Game Over';document.getElementById('overlay-text').textContent=`The word was: ${word.toUpperCase()}`;document.getElementById('overlay').classList.remove('hidden');}
document.addEventListener('keydown',e=>{if(/^[a-z]$/i.test(e.key))guess(e.key.toLowerCase());});
newGame();
</script>
</body>
</html>
