<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake Game - Play Free Online | HyperGrad Games</title>
<meta name="description" content="Play the classic Snake game online for free. Eat food, grow longer, and avoid crashing. Works on desktop and mobile with touch controls.">
<link rel="canonical" href="https://games.hypergrad.cn/games/snake.html">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/i18n.js"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Snake",
    "description": "Eat food, grow longer, and avoid crashing in the classic Snake game.",
    "url": "https://games.hypergrad.cn/games/snake.html",
    "genre": "Arcade",
    "gamePlatform": "Web Browser",
    "applicationCategory": "Game",
    "operatingSystem": "Any (Web Browser)",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "publisher": {
      "@type": "Organization",
      "name": "HyperGrad"
    }
  }
  </script>
</head>
<body>
<header class="site-header"><div class="site-header-inner"><a href="/" class="site-logo">HyperGrad <span>Games</span></a><nav class="site-nav"><a href="../index.html#puzzle">Puzzle</a><a href="../index.html#arcade">Arcade</a><a href="../index.html#strategy">Strategy</a></nav><button id="lang-switch" class="lang-btn" onclick="I18N.toggle()">中文</button></div></header>
<div class="game-page">
  <div class="game-header">
    <h1 class="game-title">Snake</h1>
    <a href="../index.html" class="game-back"><span data-i18n="game.back">← All Games</span></a>
  </div>
  <div class="game-stats">
    <div class="stat-box"><div class="stat-label" data-i18n="game.score">Score</div><div class="stat-value" id="score">0</div></div>
    <div class="stat-box"><div class="stat-label" data-i18n="game.best">Best</div><div class="stat-value" id="best">0</div></div>
  </div>
  <div class="game-board">
    <canvas id="canvas" width="400" height="400"></canvas>
    <div class="game-overlay hidden" id="overlay">
      <h2>Game Over!</h2>
      <p id="final-score">Score: 0</p>
      <button class="btn" onclick="startGame()" data-i18n-en="Play Again" data-i18n-zh="再玩一次">Play Again</button>
    </div>
  </div>
  <div class="game-controls">
    <button class="btn" onclick="startGame()" data-i18n-en="New Game" data-i18n-zh="新游戏">New Game</button>
  </div>
  <div class="game-instructions">
    <h3 data-i18n="game.howto">How to Play</h3>
    <ul>
      <li data-i18n-en="Use Arrow keys or WASD to steer the snake" data-i18n-zh="用方向键或 WASD 控制蛇的方向">Use Arrow keys or WASD to steer the snake</li>
      <li data-i18n-en="On mobile, swipe to change direction" data-i18n-zh="手机端滑动改变方向">On mobile, swipe to change direction</li>
      <li data-i18n-en="Eat the red food to grow and score points" data-i18n-zh="吃红色食物可变长并得分">Eat the red food to grow and score points</li>
      <li data-i18n-en="Don't hit the walls or your own tail" data-i18n-zh="不要撞墙或撞到自己的身体">Don't hit the walls or your own tail</li>
    </ul>
  </div>
</div>
<script>
const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');const CELL=20;const COLS=20;const ROWS=20;canvas.width=COLS*CELL;canvas.height=ROWS*CELL;
let snake,dir,nextDir,food,score,best=+localStorage.getItem('bestSnake')||0,gameLoop,running;
document.getElementById('best').textContent=best;
function startGame(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;placeFood();running=true;document.getElementById('overlay').classList.add('hidden');document.getElementById('score').textContent=score;if(gameLoop)clearInterval(gameLoop);gameLoop=setInterval(tick,120);}
function placeFood(){food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};while(snake.some(s=>s.x===food.x&&s.y===food.y))food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}
function tick(){if(!running)return;dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)){gameOver();return;}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;document.getElementById('score').textContent=score;placeFood();}else{snake.pop();}draw();}
function gameOver(){running=false;clearInterval(gameLoop);if(score>best){best=score;localStorage.setItem('bestSnake',best);document.getElementById('best').textContent=best;}document.getElementById('final-score').textContent='Score: '+score;document.getElementById('overlay').classList.remove('hidden');}
function draw(){ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#EF4444';ctx.beginPath();ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-2,0,Math.PI*2);ctx.fill();snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#818CF8':'#6366F1';ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);});}
document.addEventListener('keydown',e=>{const k=e.key;if((k==='ArrowUp'||k==='w')&&dir.y!==1)nextDir={x:0,y:-1};if((k==='ArrowDown'||k==='s')&&dir.y!==-1)nextDir={x:0,y:1};if((k==='ArrowLeft'||k==='a')&&dir.x!==1)nextDir={x:-1,y:0};if((k==='ArrowRight'||k==='d')&&dir.x!==-1)nextDir={x:1,y:0};if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();});
let tx,ty;canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
canvas.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;const dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>Math.abs(dy)){if(dx>0&&dir.x!==-1)nextDir={x:1,y:0};if(dx<0&&dir.x!==1)nextDir={x:-1,y:0};}else{if(dy>0&&dir.y!==-1)nextDir={x:0,y:1};if(dy<0&&dir.y!==1)nextDir={x:0,y:-1};}},{passive:true});
startGame();
</script>
</body>
</html>
