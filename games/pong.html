<div class="game-page">
  <div class="game-header">
    <h1 class="game-title">Pong</h1>
    <a href="../index.html" class="game-back"><span data-i18n="game.back">← All Games</span></a>
  </div>
  <div class="game-stats">
    <div class="stat-box"><div class="stat-label" data-i18n-en="You" data-i18n-zh="你">You</div><div class="stat-value" id="pscore">0</div></div>
    <div class="stat-box"><div class="stat-label" data-i18n-en="AI" data-i18n-zh="AI">AI</div><div class="stat-value" id="ascore">0</div></div>
  </div>
  <div class="game-board">
    <canvas id="canvas" width="500" height="350"></canvas>
    <div class="game-overlay" id="overlay">
      <h2 id="overlay-title">Pong</h2>

<script>
const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');const W=500,H=350;const PADDLE_H=70,PADDLE_W=10;
let player,ai,ball,pscore,ascore,running,started;
function startGame(){player={x:20,y:H/2-PADDLE_H/2};ai={x:W-30,y:H/2-PADDLE_H/2};ball={x:W/2,y:H/2,vx:4*(Math.random()>0.5?1:-1),vy:3*(Math.random()>0.5?1:-1),r:8};pscore=0;ascore=0;running=true;started=true;document.getElementById('overlay').classList.add('hidden');document.getElementById('pscore').textContent=0;document.getElementById('ascore').textContent=0;loop();}
function loop(){if(!running)return;requestAnimationFrame(loop);ball.x+=ball.vx;ball.y+=ball.vy;if(ball.y-ball.r<0||ball.y+ball.r>H)ball.vy=-ball.vy;if(ball.x<0){ascore++;document.getElementById('ascore').textContent=ascore;resetBall(-1);if(ascore>=7)gameOver(false);}if(ball.x>W){pscore++;document.getElementById('pscore').textContent=pscore;resetBall(1);if(pscore>=7)gameOver(true);}checkPaddle(player,ball.vx<0);checkPaddle(ai,ball.vx>0);ai.y+=(ball.y-PADDLE_H/2-ai.y)*0.08;ai.y=Math.max(0,Math.min(H-PADDLE_H,ai.y));draw();}
function checkPaddle(p,movingTowards){if(ball.x-ball.r<p.x+PADDLE_W&&ball.x+ball.r>p.x&&ball.y>p.y&&ball.y<p.y+PADDLE_H&&movingTowards){ball.vx=-ball.vx*1.05;const hitPos=(ball.y-(p.y+PADDLE_H/2))/(PADDLE_H/2);ball.vy=hitPos*6;}}
function resetBall(dir){ball.x=W/2;ball.y=H/2;ball.vx=4*dir;ball.vy=3*(Math.random()>0.5?1:-1);}
function gameOver(won){running=false;started=false;document.getElementById('overlay-title').textContent=won?'You Win!':'AI Wins!';document.getElementById('overlay-text').textContent=`${pscore} - ${ascore}`;document.getElementById('overlay').classList.remove('hidden');}
function draw(){ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);ctx.setLineDash([8,8]);ctx.strokeStyle='#2D2D4A';ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#6366F1';ctx.fillRect(player.x,player.y,PADDLE_W,PADDLE_H);ctx.fillStyle='#F59E0B';ctx.fillRect(ai.x,ai.y,PADDLE_W,PADDLE_H);ctx.fillStyle='#E2E8F0';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();}
canvas.addEventListener('mousemove',e=>{const rect=canvas.getBoundingClientRect();player.y=Math.max(0,Math.min(H-PADDLE_H,(e.clientY-rect.top)*(H/rect.height)));});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const rect=canvas.getBoundingClientRect();player.y=Math.max(0,Math.min(H-PADDLE_H,(e.touches[0].clientY-rect.top)*(H/rect.height)));},{passive:false});
draw();
</script>
