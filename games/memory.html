<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Memory Match - Play Free Online | HyperGrad Games</title>
<meta name="description" content="Play Memory Match online for free. Flip cards and find all matching pairs. Test your memory and improve focus. No download needed.">
<link rel="canonical" href="https://games.hypergrad.cn/games/memory.html">
<link rel="stylesheet" href="../css/style.css">
<style>
  .mem-grid { display: grid; grid-template-columns: repeat(4, 80px); gap: 10px; }
  .mem-card { width: 80px; height: 80px; perspective: 600px; cursor: pointer; }
  .mem-inner { position: relative; width: 100%; height: 100%; transition: transform 0.4s; transform-style: preserve-3d; }
  .mem-card.flipped .mem-inner { transform: rotateY(180deg); }
  .mem-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 36px; }
  .mem-front { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-dim); }
  .mem-back { background: var(--bg-card); border: 1px solid var(--primary); transform: rotateY(180deg); }
  .mem-card.matched .mem-back { border-color: var(--success); background: rgba(34,197,94,0.1); }
  @media (max-width: 768px) { .mem-grid { grid-template-columns: repeat(4, 70px); } .mem-card { width: 70px; height: 70px; } .mem-face { font-size: 30px; } }
</style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Memory Match",
    "description": "Flip cards and find all matching pairs in Memory Match.",
    "url": "https://games.hypergrad.cn/games/memory.html",
    "genre": "Puzzle",
    "gamePlatform": "Web Browser",
    "applicationCategory": "Game",
    "operatingSystem": "Any (Web Browser)",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "publisher": {
      "@type": "Organization",
      "name": "HyperGrad"
    }
  }
  </script>
</head>
<body>
<header class="site-header"><div class="site-header-inner"><a href="/" class="site-logo">HyperGrad <span>Games</span></a><nav class="site-nav"><a href="../index.html#puzzle">Puzzle</a><a href="../index.html#arcade">Arcade</a><a href="../index.html#strategy">Strategy</a></nav></div></header>
<div class="game-page">
  <div class="game-header">
    <h1 class="game-title">Memory Match</h1>
    <a href="../index.html" class="game-back">← All Games</a>
  </div>
  <div class="game-stats">
    <div class="stat-box"><div class="stat-label">Moves</div><div class="stat-value" id="moves">0</div></div>
    <div class="stat-box"><div class="stat-label">Pairs</div><div class="stat-value" id="pairs">0/8</div></div>
    <div class="stat-box"><div class="stat-label">Time</div><div class="stat-value" id="time">0</div></div>
  </div>
  <div class="game-board">
    <div class="mem-grid" id="grid"></div>
    <div class="game-overlay hidden" id="overlay">
      <h2>You Win!</h2>
      <p id="overlay-text"></p>
      <button class="btn" onclick="newGame()">Play Again</button>
    </div>
  </div>
  <div class="game-controls">
    <button class="btn" onclick="newGame()">New Game</button>
  </div>
  <div class="game-instructions">
    <h3>How to Play</h3>
    <ul>
      <li>Click cards to flip them over</li>
      <li>Find all 8 matching pairs of emojis</li>
      <li>Matched pairs stay face-up</li>
      <li>Try to win in as few moves as possible</li>
    </ul>
  </div>
</div>
<script>
const EMOJIS=['🎮','🎯','🎨','🎭','🎸','🎺','🎲','🃏'];let cards,flipped,matched,moves,timer,timerStart,lock;
function newGame(){cards=[...EMOJIS,...EMOJIS].sort(()=>Math.random()-0.5);flipped=[];matched=[];moves=0;lock=false;document.getElementById('moves').textContent=0;document.getElementById('pairs').textContent='0/8';document.getElementById('overlay').classList.add('hidden');timerStart=Date.now();if(timer)clearInterval(timer);timer=setInterval(()=>document.getElementById('time').textContent=Math.floor((Date.now()-timerStart)/1000),1000);document.getElementById('time').textContent=0;render();}
function render(){const g=document.getElementById('grid');g.innerHTML='';cards.forEach((emoji,i)=>{const card=document.createElement('div');card.className='mem-card';if(flipped.includes(i))card.classList.add('flipped');if(matched.includes(i))card.classList.add('matched','flipped');card.innerHTML=`<div class="mem-inner"><div class="mem-face mem-front">?</div><div class="mem-face mem-back">${emoji}</div></div>`;card.addEventListener('click',()=>flip(i));g.appendChild(card);});}
function flip(i){if(lock||flipped.includes(i)||matched.includes(i))return;flipped.push(i);render();if(flipped.length===2){moves++;document.getElementById('moves').textContent=moves;lock=true;setTimeout(check,600);}}
function check(){const[a,b]=flipped;if(cards[a]===cards[b]){matched.push(a,b);document.getElementById('pairs').textContent=`${matched.length/2}/8`;flipped=[];lock=false;if(matched.length===16){clearInterval(timer);const t=Math.floor((Date.now()-timerStart)/1000);document.getElementById('overlay-text').textContent=`Time: ${t}s · Moves: ${moves}`;document.getElementById('overlay').classList.remove('hidden');}}else{flipped=[];lock=false;render();}}
newGame();
</script>
</body>
</html>
