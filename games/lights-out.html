<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lights Out - Play Free Online | HyperGrad Games</title>
<meta name="description" content="Play Lights Out puzzle game online for free. Turn off all the lights on the grid. Each click toggles adjacent lights. No download needed.">
<link rel="canonical" href="https://games.hypergrad.cn/games/lights-out.html">
<link rel="stylesheet" href="../css/style.css">
<style>
  .lo-grid { display: grid; grid-template-columns: repeat(5, 60px); grid-template-rows: repeat(5, 60px); gap: 4px; }
  .lo-cell { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .lo-cell.on { background: var(--accent); box-shadow: 0 0 15px rgba(245,158,11,0.5); }
  .lo-cell:hover { transform: scale(0.95); }
  @media (max-width: 768px) { .lo-grid { grid-template-columns: repeat(5, 50px); grid-template-rows: repeat(5, 50px); } }
</style>
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"VideoGame","name":"Lights Out","description":"Turn off all the lights on the grid. Each click toggles adjacent lights.","url":"https://games.hypergrad.cn/games/lights-out.html","genre":"Puzzle","gamePlatform":"Web Browser","applicationCategory":"Game","operatingSystem":"Any (Web Browser)","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"publisher":{"@type":"Organization","name":"HyperGrad"}}
</script>
</head>
<body>
<header class="site-header"><div class="site-header-inner"><a href="/" class="site-logo">HyperGrad <span>Games</span></a><nav class="site-nav"><a href="../index.html#puzzle">Puzzle</a><a href="../index.html#arcade">Arcade</a><a href="../index.html#strategy">Strategy</a></nav></div></header>
<div class="game-page">
  <div class="game-header">
    <h1 class="game-title">Lights Out</h1>
    <a href="../index.html" class="game-back">← All Games</a>
  </div>
  <div class="game-stats">
    <div class="stat-box"><div class="stat-label">Moves</div><div class="stat-value" id="moves">0</div></div>
    <div class="stat-box"><div class="stat-label">Best</div><div class="stat-value" id="best">--</div></div>
  </div>
  <div class="game-board">
    <div class="lo-grid" id="grid"></div>
    <div class="game-overlay hidden" id="overlay">
      <h2>Solved!</h2>
      <p id="overlay-text"></p>
      <button class="btn" onclick="newGame()">Play Again</button>
    </div>
  </div>
  <div class="game-controls">
    <button class="btn" onclick="newGame()">New Game</button>
  </div>
  <div class="game-instructions">
    <h3>How to Play</h3>
    <ul>
      <li>Click a cell to toggle it and its 4 neighbors (up/down/left/right)</li>
      <li>Turn off ALL lights to win</li>
      <li>Solve in as few moves as possible</li>
    </ul>
  </div>
</div>
<script>
const N=5;let grid,moves,best=+localStorage.getItem('bestLights')||null;
if(best)document.getElementById('best').textContent=best;
function newGame(){// Start from all-off, make random valid moves to guarantee solvable
grid=Array(N).fill().map(()=>Array(N).fill(false));for(let i=0;i<8+Math.floor(Math.random()*8);i++){toggle(Math.floor(Math.random()*N),Math.floor(Math.random()*N),true);}moves=0;document.getElementById('moves').textContent=0;document.getElementById('overlay').classList.add('hidden');render();}
function toggle(r,c,silent){if(r<0||r>=N||c<0||c>=N)return;grid[r][c]=!grid[r][c];if(!silent){toggle(r-1,c,true);toggle(r+1,c,true);toggle(r,c-1,true);toggle(r,c+1,true);}}
function clickCell(r,c){toggle(r,c);moves++;document.getElementById('moves').textContent=moves;render();checkWin();}
function checkWin(){let allOff=true;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c])allOff=false;if(allOff){if(!best||moves<best){best=moves;localStorage.setItem('bestLights',best);document.getElementById('best').textContent=best;}document.getElementById('overlay-text').textContent=`Solved in ${moves} moves!`;document.getElementById('overlay').classList.remove('hidden');}}
function render(){const g=document.getElementById('grid');g.innerHTML='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){const cell=document.createElement('div');cell.className='lo-cell'+(grid[r][c]?' on':'');cell.textContent=grid[r][c]?'💡':'';cell.onclick=()=>clickCell(r,c);g.appendChild(cell);}}
newGame();
</script>
</body>
</html>
