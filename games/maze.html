<div class="game-page">

<script>
const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');let mazeSize=11,CELL,maze,player,goal,level,timer,timerStart;
function newGame(lv){level=lv||1;mazeSize=11+level*2;if(mazeSize>31)mazeSize=31;CELL=canvas.width/mazeSize;maze=genMaze(mazeSize,mazeSize);player={x:0,y:0};goal={x:mazeSize-1,y:mazeSize-1};document.getElementById('level').textContent=level;document.getElementById('overlay').classList.add('hidden');timerStart=Date.now();if(timer)clearInterval(timer);timer=setInterval(()=>document.getElementById('time').textContent=Math.floor((Date.now()-timerStart)/1000),1000);document.getElementById('time').textContent=0;draw();}
function nextLevel(){newGame(level+1);}
function genMaze(w,h){const m=Array(h).fill().map(()=>Array(w).fill(1));function carve(x,y){m[y][x]=0;const dirs=[[0,-2],[0,2],[-2,0],[2,0]].sort(()=>Math.random()-0.5);for(const[dx,dy]of dirs){const nx=x+dx,ny=y+dy;if(nx>=0&&nx<w&&ny>=0&&ny<h&&m[ny][nx]===1){m[y+dy/2][x+dx/2]=0;carve(nx,ny);}}}carve(0,0);return m;}
function move(dx,dy){const nx=player.x+dx,ny=player.y+dy;if(nx<0||nx>=mazeSize||ny<0||ny>=mazeSize)return;if(maze[ny][nx]===1)return;player.x=nx;player.y=ny;if(player.x===goal.x&&player.y===goal.y){clearInterval(timer);const t=Math.floor((Date.now()-timerStart)/1000);document.getElementById('overlay-text').textContent=`Level ${level} cleared in ${t}s!`;document.getElementById('overlay').classList.remove('hidden');}draw();}
function draw(){ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,canvas.width,canvas.height);for(let y=0;y<mazeSize;y++)for(let x=0;x<mazeSize;x++){if(maze[y][x]===1){ctx.fillStyle='#232342';ctx.fillRect(x*CELL,y*CELL,CELL,CELL);}}ctx.fillStyle='#22C55E';ctx.beginPath();ctx.arc(goal.x*CELL+CELL/2,goal.y*CELL+CELL/2,CELL/3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6366F1';ctx.beginPath();ctx.arc(player.x*CELL+CELL/2,player.y*CELL+CELL/2,CELL/3,0,Math.PI*2);ctx.fill();}
document.addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowUp'||k==='w')move(0,-1);if(k==='ArrowDown'||k==='s')move(0,1);if(k==='ArrowLeft'||k==='a')move(-1,0);if(k==='ArrowRight'||k==='d')move(1,0);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();});
let tx,ty;canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
canvas.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;const dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)<20&&Math.abs(dy)<20)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy>0?1:-1);},{passive:true});
newGame(1);
</script>
